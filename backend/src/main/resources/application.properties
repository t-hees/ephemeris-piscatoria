server.port=${BACKEND_PORT}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}

spring.application.name=fish-project
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_DBNAME}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.initialization-fail-timeout=30000

# The schema is created by the flyway migrations in resources/db/migration,
# hibernate only checks at startup that the entities match it
spring.jpa.hibernate.ddl-auto=validate

# Images are uploaded one per request, the frontend checks the size as well
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Read the rest of a too large upload (up to the proxy limit in nginx.conf.template), otherwise tomcat
# closes the connection and the client gets a connection reset instead of the 413 response
server.tomcat.max-swallow-size=12MB

jwt.secret=${JWT_SECRET}

# Optional admin account created on startup, the only account that may upload images
admin.username=${ADMIN_USERNAME:}
admin.password=${ADMIN_PASSWORD:}

# Accounts of regular users are deleted after this time (ISO-8601 duration, 0 keeps them forever)
demo.user-ttl=${DEMO_USER_TTL:PT1H}
demo.cleanup-interval=PT5M

# Cloudflare Turnstile captcha for the registration, disabled when not set
turnstile.site-key=${TURNSTILE_SITE_KEY:}
turnstile.secret=${TURNSTILE_SECRET:}

# The backend is only reached through the nginx proxy of the frontend container, tomcat takes the client
# address from its X-Forwarded-For header (only trusted from internal addresses like the docker network)
server.forward-headers-strategy=native

