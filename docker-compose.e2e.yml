name: fish-project-e2e

services:
  e2e-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: e2e-db
      DB_PORT: 3306
      DB_DBNAME: e2edatabase
      DB_USERNAME: e2euser
      DB_PASSWORD: e2epass
      BACKEND_PORT: 8080
      JWT_SECRET: pTj+DBXRkyetocsvSTE1n4r95Gq8rCnCeKvl2qDNBDc=
      # The only user that may upload images, see e2e/tests/helpers.ts
      ADMIN_USERNAME: e2e-admin
      ADMIN_PASSWORD: e2e-admin-password
      # Cloudflare's always passing test keys, see e2e/tests/helpers.ts
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
    depends_on:
      e2e-db:
        condition: service_healthy
  e2e-frontend:
    build:
      context: ./frontend
    # Differs from the default FRONTEND_PORT so it can run next to the regular stack
    ports:
      - 127.0.0.1:3040:80
    environment:
      BACKEND_HOST: e2e-backend
      BACKEND_PORT: 8080
      # All test requests come from one address, the production limits would reject most of them
      RATE_LIMIT_REGISTER: 600r/m
      RATE_LIMIT_REGISTER_BURST: 100
      RATE_LIMIT_LOGIN: 600r/m
      RATE_LIMIT_LOGIN_BURST: 100
    depends_on:
      - e2e-backend
  e2e-db:
    image: docker.io/library/mariadb:11.8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: e2edatabase
      MYSQL_USER: e2euser
      MYSQL_PASSWORD: e2epass
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/mysql
