# Ports are only bound to 127.0.0.1: docker bypasses host firewalls
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      # Port inside the compose network, DB_PORT is only the port published on the host
      DB_PORT: 3306
      DB_DBNAME: ${DB_DBNAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      BACKEND_PORT: ${BACKEND_PORT}
      JWT_SECRET: ${JWT_SECRET}
      # Optional, an admin account is created on startup if both are set
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional, registration has no captcha without them
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      # Optional, how long accounts of regular users live (ISO-8601 duration, 0 keeps them forever)
      DEMO_USER_TTL: ${DEMO_USER_TTL:-PT1H}
      # Optional limits for small servers, e.g. JAVA_TOOL_OPTIONS=-Xmx256m
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-200}
    depends_on:
      - db
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - 127.0.0.1:${FRONTEND_PORT}:80
    environment:
      # nginx proxies /api to this address inside the compose network
      BACKEND_HOST: backend
      BACKEND_PORT: ${BACKEND_PORT}
    depends_on:
      - backend
  db:
    image: docker.io/library/mariadb:12.3
    restart: unless-stopped
    command: --innodb-buffer-pool-size=${DB_BUFFER_POOL_SIZE:-128M}
    # Only for local development, the backend reaches the database inside the compose network
    ports:
      - 127.0.0.1:${DB_PORT}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DBNAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - fish-db:/var/lib/mysql
volumes:
  fish-db:
