name: Frontend Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        run: make frontend-lint

      - name: Typecheck
        run: make frontend-typecheck

      - name: Run unit tests
        run: make frontend-unit-test

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Frontend test report
          report_paths: frontend/reports/junit.xml
          annotate_only: true
          detailed_summary: true
          include_passed: true
          include_time_in_summary: true
