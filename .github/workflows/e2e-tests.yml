name: E2E Tests

# Slower than the other test workflows, so it only runs for pull requests and on demand
on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Starts and stops the application stack and prints its logs on failure
      - name: Run e2e tests
        run: make e2e-test PLAYWRIGHT_INSTALL_FLAGS=--with-deps

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
